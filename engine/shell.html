<meta charset="utf-8">
<title>Story Opening — walk in, wave, title</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--paper:#F0EEE6;--card:#FBFBFA;--ink:#3D5BD9;--text:#23252B;--muted:#767C8A;--rule:#DEDCD3}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--text);
    font-family:"Space Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1020px;margin:0 auto;padding:28px 22px 56px}
  header{display:flex;align-items:baseline;gap:13px;margin-bottom:16px;flex-wrap:wrap}
  h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em}
  .sub{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted)}
  .stage{background:var(--card);border:1px solid var(--rule);border-radius:3px;overflow:hidden}
  canvas{display:block;width:100%;height:auto}
  .bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;
    padding:11px 13px;border-top:1px solid var(--rule)}
  button{font-family:inherit;font-size:12.5px;font-weight:500;color:var(--text);
    background:transparent;border:1px solid var(--rule);border-radius:2px;
    padding:6px 12px;cursor:pointer;transition:background .12s,border-color .12s}
  button:hover{background:#F2F1EC;border-color:#C9C7BE}
  button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
  button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  #scrub{flex:1;min-width:150px;accent-color:var(--ink)}
  .mini{width:84px;accent-color:var(--ink)}
  .mlab{min-width:auto;text-align:left;padding-left:4px}
  .tag{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);min-width:96px;text-align:right}
  .pick{margin-top:22px;border-top:1px solid var(--rule);padding-top:14px}
  .pickhead{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);
    letter-spacing:.06em;text-transform:uppercase;margin-bottom:11px}
  .opts{display:grid;gap:8px}
  .opt{display:grid;grid-template-columns:26px 1fr;gap:11px;align-items:start;
    background:var(--card);border:1px solid var(--rule);border-radius:2px;
    padding:11px 13px;cursor:pointer;text-align:left;font-size:13px}
  .opt:hover{border-color:var(--ink)}
  .opt.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--card);color:var(--text)}
  .opt em{font-family:"IBM Plex Mono",monospace;font-style:normal;font-size:10.5px;color:var(--muted)}
  .opt b{font-weight:500;display:block;line-height:1.45}
  .opt i{font-style:normal;color:var(--muted);display:block;line-height:1.45}
  .why{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header><h1><!--TITLE--></h1><span class="sub"><!--SUB--></span></header>
  <div class="stage">
    <canvas id="c" width="1600" height="900"></canvas>
    <!--MEDIA-->
    <div class="bar">
      <button id="play" class="on">Pause</button>
      <button id="back">Restart</button>
      <button id="mute" class="on">Mute clip</button>
      <input type="range" id="scrub" min="0" max="1000" value="0">
      <span class="tag" id="tag">\u2014</span>
      <button id="rec">Record WebM</button>
    </div>
    <div class="bar">
      <span class="tag" style="min-width:52px;text-align:left">Music</span>
      <button class="mus" data-m="">None</button>
      <!--BEDS-->
      <span class="tag mlab">bed</span><input type="range" class="mini" id="mvol" min="0" max="100" value="55">
      <span class="tag mlab">lessons</span><input type="range" class="mini" id="mlow" min="0" max="100" value="22">
      <span class="tag mlab">clip</span><button id="mclip" class="on">muffled</button>
      <span class="tag" id="mustag" style="flex:1;min-width:190px"></span>
    </div>
  </div>
  <!--EXTRA-->
</div>


<script>
<!--SCRIPT-->
</script>
